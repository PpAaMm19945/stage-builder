# SchoolOS Cloudflare Worker Configuration
# ========================================
# SETUP INSTRUCTIONS (No CLI needed!):
#
# 1. In Cloudflare Dashboard → D1 → Create Database → name it "schoolos-db"
# 2. Copy the Database ID and paste it below
# 3. Go to Workers & Pages → Create → Worker → "Import from GitHub"
# 4. Select your repo, set "cloudflare" as the root directory
# 5. Add secrets in Worker Settings → Variables → Secrets
#
# Required Secrets (add in Cloudflare Dashboard):
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET  
# - JWT_SECRET (generate a random 32+ character string)
#
# Required Variables (add in Cloudflare Dashboard):
# - GOOGLE_REDIRECT_URI = https://your-worker.workers.dev/auth/google/callback
# - FRONTEND_URL = https://your-app.lovable.app

name = "schoolos-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "schoolos-db"
database_id = "acb84cf7-fd3b-4083-b08a-9f28f131fc3f"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
