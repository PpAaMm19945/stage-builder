# SchoolOS Cloudflare Worker Configuration
# ========================================

name = "stage-builder"
account_id = "4b9e1f0f3d5f50f35db086b8ae9431e1"
main = "src/index_v2.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------
# D1 Database binding
# ------------------------
[[d1_databases]]
binding = "DB"
database_name = "schoolos-v2"
database_id = "fe3ef8e7-dff9-473b-81a2-24997fe8c8d1"
migrations_dir = "migrations"

# ------------------------
# R2 Storage for books and media
# ------------------------
[[r2_buckets]]
binding = "BOOKS_BUCKET"
bucket_name = "schoolos-books"

# ------------------------
# Workers AI binding
# ------------------------
[ai]
binding = "AI"

# ------------------------
# Vectorize (Curriculum Memory)
# ------------------------
[[vectorize]]
binding = "CURRICULUM_INDEX"
index_name = "schoolos-curriculum-docs"

# ------------------------
# Runtime variables
# ------------------------
[vars]
ENVIRONMENT = "production"


# App URLs
GOOGLE_REDIRECT_URI = "https://stage-builder.antmwes104-1.workers.dev/auth/google/callback"
FRONTEND_URL = "https://stage-builder-9hh.pages.dev"
R2_PUBLIC_URL = "https://pub-ca8030f7c94b40f68be9f17bfd8977c0.r2.dev"
ADMIN_EMAIL_ALLOWLIST = "antmwes104.1@gmail.com"

# ------------------------
# AI Gateway configuration
# ------------------------
AI_GATEWAY_HOST = "https://gateway.ai.cloudflare.com"
AI_GATEWAY_ACCOUNT_ID = "4b9e1f0f3d5f50f35db086b8ae9431e1"
AI_GATEWAY_NAME = "schoolos-gateway"

# Derived usage (do NOT hardcode in code):
# ${AI_GATEWAY_HOST}/v1/${AI_GATEWAY_ACCOUNT_ID}/${AI_GATEWAY_NAME}/compat
