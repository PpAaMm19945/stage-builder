name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - dev  # Also deploy on dev branch
    paths:
      - 'cloudflare/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./cloudflare
        run: npm install
      
      # NOTE: D1 migrations are run MANUALLY by the developer
      # Run: wrangler d1 migrations apply DB --remote
      # This avoids issues with automatic migrations in CI
      
      - name: Deploy Worker (Production)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./cloudflare

      - name: Deploy Worker (Dev)
        if: github.ref == 'refs/heads/dev'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./cloudflare
          command: deploy --env dev
